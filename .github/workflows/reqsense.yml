# ReqSense CI: runs the ReqSense tests automatically on every push (GitHub Actions).
name: ReqSense tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Doorstop + ReqSense (light: the tests use fake AI models)
        run: |
          pip install -e .
          pip install numpy scikit-learn pytest pytest-cov

      - name: Unit + integration tests (fail if coverage < 80%)
        run: pytest doorstop/reqsense --cov=doorstop/reqsense --cov-report=term-missing --cov-fail-under=80

      - name: Dog-food - analyze Doorstop's own requirements
        run: doorstop analyze REQ --checks ambiguity,redundancy,conflict --format md -o reqsense-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: reqsense-report-${{ matrix.python-version }}
          path: reqsense-report.md